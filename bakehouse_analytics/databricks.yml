# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 5f45943b-b85a-4034-b8b7-ea7aebd4430a

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse que ejecuta las consultas del dashboard

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405618812141483.3.azuredatabricks.net
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
      warehouse_id: d14b4d02a7954539
  prod:
    mode: production
    workspace:
      host: https://adb-7405613701336192.12.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/lsb.davidbernal@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lsb.davidbernal@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: rnd
      warehouse_id: cd2406f92a3b6578
    permissions:
      - user_name: lsb.davidbernal@gmail.com
        level: CAN_MANAGE
